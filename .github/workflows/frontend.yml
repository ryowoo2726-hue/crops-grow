name: Flutter Web
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: node --test backend/backend.test.cjs
      - run: node --test scripts/finalize-web.test.cjs
      - name: Build web
        env:
          API_BASE_URL: ${{ vars.GROWGAME_API_BASE_URL || 'https://cropgrow-api.sangsangbar.com' }}
        run: |
          flutter build web --wasm --no-web-resources-cdn --dart-define=API_BASE_URL="$API_BASE_URL"
          node scripts/finalize-web.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: build/web
