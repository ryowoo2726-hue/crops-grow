<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>설문조사 · 작물 키우기 UI 초안</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #223c2e;
      --muted: #52634e;
      --leaf: #2e6544;
      --paper: #fffdf6;
      --line: #d8dfce;
      font: 100%/1.55 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: var(--ink);
      background: #263b28;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      background: linear-gradient(#1e352270, #1e3522b0), url("../assets/optimized/bg-school-farm-228a3f97682abaac.webp") center / cover;
    }
    main { width: min(100%, 428px); }
    .context {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin: 0 4px 10px; color: white; font-size: .875rem; font-weight: 700;
    }
    .context span:last-child {
      background: #223b2c; border: 1px solid #b6cab0; padding: 2px 10px; border-radius: 999px;
    }
    section, form {
      background: var(--paper);
      padding: clamp(16px, 5vw, 30px);
      border: 1px solid #fffae5; border-radius: 24px;
      box-shadow: 0 16px 42px #14251460;
    }
    [hidden] { display: none !important; }
    h1, h2, p, figure { margin: 0; }
    h1, h2, legend { line-height: 1.3; letter-spacing: -.04em; }
    h1, h2 { font-size: clamp(1.625rem, 6vw, 2rem); }
    .intro, .complete { text-align: center; }
    .intro p, .complete p { color: var(--muted); margin-top: 10px; }
    .art {
      width: 108px; height: 108px; margin: 0 auto 14px; display: grid; place-items: center;
      border-radius: 50%; border: 1px solid #d7e3bf; background: radial-gradient(#fffdf2, #e9f0d8);
    }
    .art img { display: block; width: 104px; height: 104px; object-fit: contain; }
    .reward {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: center;
      background: #f7ebca; border: 1px solid #e8d7a4; border-radius: 14px;
      margin: 20px 0 16px; padding: 10px 14px; color: #684914; text-align: left;
    }
    .reward strong { font-size: 1.375rem; letter-spacing: -.04em; }
    button {
      min-height: 48px; padding: 10px 16px; border-radius: 12px; border: 1px solid transparent;
      font: inherit; font-weight: 700; cursor: pointer; touch-action: manipulation;
    }
    .primary { background: var(--leaf); color: white; }
    .primary:hover:not(:disabled) { background: #255637; }
    .primary:disabled { background: #e2e8dc; color: #52634e; cursor: default; }
    .secondary { background: transparent; border-color: var(--line); color: var(--ink); }
    .secondary:hover { background: #f2f4e8; }
    .intro button, .complete button { width: 100%; }
    button:focus-visible, .option:has(input:focus-visible) { outline: 3px solid #a46b19; outline-offset: 3px; }
    .progress-row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-top: 14px; }
    .progress-row strong { font-size: .875rem; }
    .progress-row span { color: var(--muted); font-size: .8125rem; text-align: right; }
    progress {
      display: block; appearance: none; width: 100%; height: 8px; margin: 8px 0 20px;
      border: 0; border-radius: 999px; background: #e6ebdf;
    }
    progress::-webkit-progress-bar { background: #e6ebdf; border-radius: 999px; }
    progress::-webkit-progress-value { background: var(--leaf); border-radius: 999px; }
    progress::-moz-progress-bar { background: var(--leaf); border-radius: 999px; }
    fieldset { padding: 0; margin: 0; border: 0; min-width: 0; }
    legend { padding: 0; font-size: 1.1875rem; font-weight: 700; margin-bottom: 12px; }
    .options { display: grid; gap: 8px; }
    .option {
      display: flex; gap: 10px; align-items: center; min-height: 48px; padding: 8px 12px;
      border: 1px solid var(--line); border-radius: 12px; background: white; cursor: pointer;
    }
    .option:hover { border-color: var(--leaf); }
    .option:has(input:checked) { background: #edf4e8; border-color: var(--leaf); font-weight: 700; }
    .option input { width: 18px; height: 18px; flex: none; accent-color: var(--leaf); margin: 0; }
    .actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 18px; }
    .complete .reward { justify-content: center; }
  </style>
</head>
<body>
  <main>
    <header class="context"><span>작물 키우기 · 특별 미션</span><span>UI 초안</span></header>

    <section id="intro" class="intro" aria-labelledby="intro-title">
      <figure class="art"><img src="../assets/optimized/rice-harvest-d815cfe45f215190.webp" width="104" height="104" alt=""></figure>
      <h1 id="intro-title" tabindex="-1">설문조사</h1>
      <p>작물 키우기에서 느낀 점을 알려주세요.<br>모든 문항에 답하고 제출하면 보상을 받아요.</p>
      <div class="reward"><span>완료 보상</span><strong>성장 +100%</strong></div>
      <button class="primary" id="start" type="button">설문 시작</button>
    </section>

    <form id="survey" hidden aria-labelledby="survey-title">
      <h2 id="survey-title">설문조사</h2>
      <div class="progress-row"><strong id="step"></strong><span id="answered" role="status"></span></div>
      <progress id="progress" value="0" aria-label="응답한 문항 수"></progress>
      <fieldset>
        <legend id="question" tabindex="-1"></legend>
        <div id="options" class="options"></div>
      </fieldset>
      <div class="actions">
        <button class="secondary" id="back" type="button">이전</button>
        <button class="primary" id="next" type="submit" disabled>다음</button>
      </div>
    </form>

    <section id="complete" class="complete" hidden aria-labelledby="complete-title">
      <figure class="art"><img src="../assets/optimized/rice-harvest-d815cfe45f215190.webp" width="104" height="104" alt=""></figure>
      <h2 id="complete-title" tabindex="-1">설문 참여 완료!</h2>
      <p>모든 문항에 답해 주셔서 고마워요.</p>
      <div class="reward"><span>받은 보상</span><strong>성장 +100%</strong></div>
      <button class="primary" id="restart" type="button">미리보기 처음으로</button>
    </section>
  </main>
  <script>
    const questions = [
      ['작물 키우기는 얼마나 재미있었나요?', ['정말 재미있었어요', '조금 재미있었어요', '보통이었어요', '별로 재미없었어요', '전혀 재미없었어요']],
      ['가장 재미있었던 활동은 무엇인가요?', ['물 주고 작물 키우기', '퀴즈와 특별 미션', '수확하고 도감 채우기', '친구들의 밭 둘러보기', '특별히 없었어요']],
      ['처음 접속했을 때 게임 방법을 알기 쉬웠나요?', ['매우 쉬웠어요', '조금 쉬웠어요', '보통이었어요', '조금 어려웠어요', '매우 어려웠어요']],
      ['일일 퀴즈의 난이도는 어땠나요?', ['너무 쉬웠어요', '조금 쉬웠어요', '적당했어요', '조금 어려웠어요', '너무 어려웠어요', '일일 퀴즈를 풀지 않았어요']],
      ['게임을 하면서 가장 불편했던 점은 무엇인가요?', ['접속하거나 로그인하기', '메뉴나 버튼 찾기', '설명 읽기', '게임이 느리거나 멈춤', '그 밖의 불편이 있었어요', '불편한 점이 없었어요']],
      ['게임을 하면서 실제 작물이 자라는 과정이 궁금해졌나요?', ['매우 궁금해졌어요', '조금 궁금해졌어요', '별로 궁금해지지 않았어요', '전혀 궁금해지지 않았어요']],
      ['다음 행사에 무엇이 추가되면 좋겠나요?', ['키울 수 있는 작물 더 많이', '친구와 함께 하는 미션', '새로운 종류의 퀴즈나 특별 미션', '밭 꾸미기', '지금 구성이 좋아요']],
      ['다음 행사에도 참여하고 싶나요?', ['꼭 참여하고 싶어요', '참여하고 싶은 편이에요', '아직 잘 모르겠어요', '참여하고 싶지 않은 편이에요', '전혀 참여하고 싶지 않아요']],
    ];
    const byId = id => document.getElementById(id);
    const intro = byId('intro'), survey = byId('survey'), complete = byId('complete');
    const question = byId('question'), options = byId('options'), next = byId('next'), progress = byId('progress');
    const answers = Array(questions.length).fill(null);
    progress.max = questions.length;
    let index = 0;

    function show(panel, focus) {
      for (const screen of [intro, survey, complete]) screen.hidden = screen !== panel;
      focus.focus();
    }

    function updateProgress() {
      const count = answers.filter(answer => answer !== null).length;
      progress.value = count;
      byId('answered').textContent = `${questions.length}문항 중 ${count}개 응답`;
      const last = index === questions.length - 1;
      next.disabled = last ? count !== questions.length : answers[index] === null;
    }

    function renderQuestion() {
      const [prompt, choices] = questions[index];
      byId('step').textContent = `문항 ${index + 1} / ${questions.length}`;
      question.textContent = prompt;
      options.replaceChildren(...choices.map((choice, value) => {
        const label = document.createElement('label');
        label.className = 'option';
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'answer';
        radio.value = value;
        radio.checked = answers[index] === value;
        label.append(radio, choice);
        return label;
      }));
      next.textContent = index === questions.length - 1 ? '설문 제출' : '다음';
      updateProgress();
      show(survey, question);
    }

    byId('start').onclick = renderQuestion;
    byId('back').onclick = () => {
      if (index === 0) show(intro, byId('intro-title'));
      else {
        index -= 1;
        renderQuestion();
      }
    };
    options.onchange = event => {
      answers[index] = Number(event.target.value);
      updateProgress();
    };
    survey.onsubmit = event => {
      event.preventDefault();
      if (next.disabled) return;
      if (index === questions.length - 1) show(complete, byId('complete-title'));
      else {
        index += 1;
        renderQuestion();
      }
    };
    byId('restart').onclick = () => {
      answers.fill(null);
      index = 0;
      show(intro, byId('intro-title'));
    };
  </script>
</body>
</html>
